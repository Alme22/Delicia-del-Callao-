
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fce4ec;
      color: #6a1b4d;
      padding: 50px 20px;
    }
    .caja {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 450px;
      margin: auto;
    }
    button {
      background: #d63384;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>¡Hola, mundo! 💗</h1>
    <p>Esta es mi primera página web.</p>
    <button onclick="alert('¡Gracias por visitar mi página!')">
      Haz clic aquí
    </button>
  </div>
</body>
</html>
